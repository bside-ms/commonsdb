name: commonsdb

x-app: &app
  image: ghcr.io/${IMAGE_OWNER}/commonsdb:${IMAGE_TAG}
  env_file: .env

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: commonsdb
      POSTGRES_USER: commonsdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commonsdb']
      interval: 5s
      retries: 10

  migrate:
    <<: *app
    command: ['node', 'packages/db/src/migrate-cli.ts']
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }

  webapp:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - uploads:/data/uploads
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  uploads: