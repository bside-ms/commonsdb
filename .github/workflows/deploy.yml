name: deploy

on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      environment: { type: string, required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/commonsdb:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/commonsdb:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: infra/compose.prod.yml
          sparse-checkout-cone-mode: false
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Roll out
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          PORT: ${{ vars.SSH_PORT || '22' }}
          DIR: ${{ vars.DEPLOY_DIR }}
          TAG: ${{ needs.build.outputs.tag }}
          OWNER: ${{ needs.build.outputs.owner }}
        run: |
          scp -P "$PORT" infra/compose.prod.yml "$TARGET:$DIR/compose.yml"
          ssh -p "$PORT" "$TARGET" "cd '$DIR' && export IMAGE_TAG='$TAG' IMAGE_OWNER='$OWNER' \
            && docker compose pull migrate webapp \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"